<title>Business OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: dark green sidebar (overview / business / global) → top bar (title, search, month, add) → sub-tabs → colored KPI tiles → dark chart card + side panels → tables. Mirrors the LifeOS money screen, for Imran's businesses. */
:root{
  --bg:#F2F5F4; --panel:#FFFFFF; --soft:#EAF0EE; --fg:#14211E; --muted:#5C6E69; --line:#D7E0DD;
  --side:#0F3D35; --side-fg:#E3F0EC; --side-mute:#8DB3A9; --side-act:#1B5A4E; --accent:#13896F;
  --t1:#1F6F8B; --t2:#13896F; --t3:#C4424F; --t4:#6A4FC4; --t5:#C9661C; --t6:#167B98; --tilefg:#FFFFFF;
  --dark:#16211F; --dark-fg:#E6EFEC; --dark-mute:#9FB4AE; --dark-line:rgba(255,255,255,.08);
  --good:#0E8A62; --warn:#B8650E; --bad:#C2363F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --panel:#151F1C; --soft:#1C2925; --fg:#E3ECE9; --muted:#93A6A0; --line:#28372F;
  --side:#0A2621; --side-fg:#E3F0EC; --side-mute:#7FA197; --side-act:#174A40; --accent:#34C08E;
  --dark:#0F1816; --dark-line:rgba(255,255,255,.07); --good:#34C08E; --warn:#E8973A; --bad:#EE6B73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --panel:#151F1C; --soft:#1C2925; --fg:#E3ECE9; --muted:#93A6A0; --line:#28372F;
  --side:#0A2621; --side-fg:#E3F0EC; --side-mute:#7FA197; --side-act:#174A40; --accent:#34C08E;
  --dark:#0F1816; --dark-line:rgba(255,255,255,.07); --good:#34C08E; --warn:#E8973A; --bad:#EE6B73; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;padding:2px 6px 6px}
.brand i{width:32px;height:32px;border-radius:9px;background:#1E8A6F;display:grid;place-items:center;font-style:normal}
.grp{display:grid;gap:1px}
.grp h3{margin:4px 8px 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mute);font-weight:600}
.nav{font:inherit;text-align:left;background:none;border:0;color:var(--side-fg);padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav:hover{background:rgba(255,255,255,.06)}
.nav[aria-current="page"]{background:var(--side-act)}
.nav svg{width:16px;height:16px;flex:none;opacity:.9}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;min-width:20px;text-align:center;padding:0 6px;border-radius:99px;background:#C4424F;color:#fff}
.nav .ext{margin-left:auto;font-size:11px;color:var(--side-mute)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12.5px}
.me i{width:32px;height:32px;border-radius:50%;background:#1E8A6F;display:grid;place-items:center;font-style:normal;font-weight:700}
main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px 0;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toprow h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.toprow .sub{display:block;font-size:12px;color:var(--muted)}
.search{flex:1 1 220px;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--bg)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--fg);padding:8px 0;min-width:0;outline:none}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:focus-visible,.nav:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{font:inherit;font-size:13.5px;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.content{padding:16px 24px 40px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
.bar2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--fg);font-weight:600}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;color:var(--muted);background:var(--panel);white-space:nowrap}
.chip b{color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;overflow:hidden;border-radius:12px;padding:12px 14px;background:var(--c);color:var(--tilefg);display:grid;gap:2px;min-height:100px;align-content:start;min-width:0}
.tile::after{content:"";position:absolute;right:-16px;bottom:-20px;width:78px;height:78px;border-radius:18px;background:rgba(255,255,255,.09);transform:rotate(16deg)}
.tile small{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;opacity:.9}
.tile b{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.3vw,30px);line-height:1.15;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;opacity:.9}
.grid3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:stretch}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.gridE{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:14px;align-items:start}
@media (max-width:1000px){.grid3,.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:grid;gap:8px;align-content:start}
.card.dark{background:var(--dark);color:var(--dark-fg);border-color:var(--dark)}
.card.dark .note{color:var(--dark-mute)}
.card h2{margin:0;font-family:var(--display);font-weight:600;font-size:16.5px;text-wrap:balance}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.vline{border-left:1px solid var(--dark-line);padding-left:16px;display:grid;gap:10px;align-content:start}
@media (max-width:700px){.vline{border-left:0;padding-left:0}}
.big{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;opacity:.85}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.legend i.dash{width:14px;height:2px;border-radius:0;vertical-align:3px;background:repeating-linear-gradient(90deg,#F2C14E 0 4px,transparent 4px 7px)}
.chart{position:relative;min-height:220px}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:5px 9px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:3}
.tip .d{color:var(--muted)}
.kv{display:grid;gap:7px}
.kv div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.kv i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.list{display:grid}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dark .li{border-color:var(--dark-line)}
.li:last-child{border-bottom:0}
.li .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.li .t{display:grid;min-width:0}
.li .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12px;color:var(--muted)}
.dark .li .t span{color:var(--dark-mute)}
.li .p{margin-left:auto;font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:8px;border-radius:99px;background:rgba(127,127,127,.2);overflow:hidden}
.prog div{height:100%;border-radius:99px;background:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.amt.in{color:var(--good);font-weight:600}
.amt.out{color:var(--bad);font-weight:600}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.b{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.empty{display:grid;gap:8px;justify-items:start;padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty b{color:var(--fg);font-family:var(--display);font-weight:600;font-size:15px}
.empty.dk{border-color:var(--dark-line);color:var(--dark-mute)}
.empty.dk b{color:var(--dark-fg)}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{flex:1;min-width:0}
.task .meta{font-size:12px;color:var(--muted)}
.banner{border-radius:10px;padding:10px 12px;font-size:13px;background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line))}
.att{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att .dot{width:10px;height:10px;border-radius:50%}
.ext-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--fg);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(8,18,15,.55)}
.dlg{display:grid;gap:12px;padding:18px}
.dlg h2{margin:0;font-family:var(--display);font-weight:600;font-size:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.fields label.full{grid-column:1/-1}
.fields h3.fh{grid-column:1/-1;margin:8px 0 0;font-size:13px;color:var(--text)}
.fields input,.fields select,.fields textarea{width:100%;box-sizing:border-box}
@media (max-width:480px){.fields{grid-template-columns:1fr}}
.dlg .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .act .left{margin-right:auto}
.err{color:var(--bad);font-size:12.5px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hl{background:color-mix(in srgb,var(--warn) 30%,transparent);border-radius:3px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;overflow-x:auto;padding:8px;padding-left:max(8px,env(safe-area-inset-left,0px));gap:4px}
  .brand,.grp h3,.me{display:none}
  .grp{display:flex;gap:2px}
  .nav{white-space:nowrap;padding:7px 9px}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search{order:3;max-width:none;flex-basis:100%}
}
@media (max-width:860px){.ib-grid{grid-template-columns:1fr!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:760px){.ib-shell{grid-template-columns:1fr!important}.ib-shell>nav{display:flex!important;flex-wrap:wrap;gap:4px}.ib-shell>nav>div{display:none}.ib-shell>nav>button{width:auto!important}}
</style>

<div class="app">
  <aside class="side" aria-label="Main menu">
    <div class="brand"><i>B</i>Business OS</div>
    <div class="grp"><h3>Overview</h3>
      <button class="nav" data-go="overview"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 7l6-5 6 5v7H2z"/></svg>Business Overview</button>
      <button class="nav" data-go="today"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6h12M5 1v3M11 1v3"/></svg>Today</button>
      <button class="nav" data-go="tasks"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="2.5" width="3.5" height="11" rx="1"/><rect x="6.25" y="2.5" width="3.5" height="7" rx="1"/><rect x="11" y="2.5" width="3.5" height="9" rx="1"/></svg>Tasks</button>
      <button class="nav" data-go="goals"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r=".8" fill="currentColor"/></svg>Target & Goal</button>
      <button class="nav" data-go="recovery"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 13h12M4 13V8M8 13V4M12 13V6"/></svg>Recovery 90</button>
      <button class="nav" data-go="review"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8a6 6 0 1 0 2-4.5M2 2v3h3"/></svg>Review<span class="badge" id="b-review" hidden></span></button>
      <button class="nav" data-go="attention"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1l7 7-7 7-7-7z"/><path d="M8 5v4M8 11v.5"/></svg>Attention<span class="badge" id="b-att" hidden></span></button>
    </div>
    <div class="grp"><h3>Business</h3>
      <button class="nav" data-go="money"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="4" width="13" height="9" rx="2"/><circle cx="8" cy="8.5" r="2"/></svg>Money</button>
      <button class="nav" data-go="biz:kidscare"><svg viewBox="0 0 16 16" fill="#F2A65A"><circle cx="8" cy="8" r="4"/></svg>Kids Care BD</button>
      <button class="nav" data-go="biz:insafia"><svg viewBox="0 0 16 16" fill="#D58A7A"><circle cx="8" cy="8" r="4"/></svg>Insafia</button>
      <button class="nav" data-go="biz:lrf"><svg viewBox="0 0 16 16" fill="#5FD0A3"><circle cx="8" cy="8" r="4"/></svg>Local Revenue Flow</button>
      <button class="nav" data-go="biz:itevs"><svg viewBox="0 0 16 16" fill="#7FB0F5"><circle cx="8" cy="8" r="4"/></svg>Itevs Digital</button>
      <button class="nav" data-go="biz:hajj"><svg viewBox="0 0 16 16" fill="#A78BFA"><circle cx="8" cy="8" r="4"/></svg>Hajj/Umrah + RE</button>
      <button class="nav" data-go="biz:others"><svg viewBox="0 0 16 16" fill="#9FB4B0"><circle cx="8" cy="8" r="4"/></svg>Onnanno</button>
    </div>
    <div class="grp"><h3>Global</h3>
      <button class="nav" data-go="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>Search</button>
      <button class="nav" data-go="ideas"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5a4.5 4.5 0 0 0-2.5 8.2V12h5V9.7A4.5 4.5 0 0 0 8 1.5zM6 14h4"/></svg>Idea Book</button>
      <button class="nav" data-go="knowledge"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2.5h7.5L13 5v8.5H3z"/><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3"/></svg>Knowledge Store</button>
      <button class="nav" data-go="issues"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 4.5v4M8 10.5v.5"/></svg>Issues<span class="badge" id="b-iss" hidden></span></button>
      <button class="nav" data-go="live"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12l3-4 3 2 4-6 2 2"/></svg>Live report</button>
      <button class="nav" data-go="learning"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 5.5L8 2.5l6.5 3L8 8.5z"/><path d="M4 7v3.5c1.2 1 2.6 1.5 4 1.5s2.8-.5 4-1.5V7"/></svg><span>Learning</span><span class="badge" id="b-learn" hidden></span></button>
      <button class="nav" data-go="books"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 2.5h4a1.5 1.5 0 0 1 1.5 1.5v9.5a1.2 1.2 0 0 0-1.2-1.2H2.5zM13.5 2.5h-4A1.5 1.5 0 0 0 8 4v9.5a1.2 1.2 0 0 1 1.2-1.2h4.3z"/></svg><span>Book Library</span><span class="badge" id="b-books" hidden></span></button>
    </div>
    <div class="me"><i>I</i><div><b>Imran Hossain Alif</b><br>Owner</div></div>
  </aside>

  <main>
    <div class="top">
      <div class="toprow">
        <div><h1 id="title">Business Overview</h1><span class="sub" id="subtitle">Shob business er ek jaygay hishab</span></div>
        <label class="search"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" type="search" placeholder="Transaction, loan, idea, issue khujun" aria-label="Search"><kbd>/</kbd></label>
        <button class="btn primary" id="addTx">+ Add transaction</button>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    </div>
    <div class="content">
      <div class="bar2">
        <div class="crumb" id="crumb"></div>

const dlg = document.getElementById('dlg'), form = document.getElementById('form');
function openForm(col, rec, preset = {}) {
  if (!canWrite) { toast('Apnar ei page e likhar permission nai'); return; }
  const F = FORMS[col]; const vals = Object.assign({}, preset, rec || {});
  if (col === 'tasks' && rec && !rec.status) vals.status = rec.done ? 'complete' : 'todo';
  F.fields().forEach((f) => { if (vals[f.k] == null && f.d != null) vals[f.k] = f.d; });
  form.replaceChildren();
  const box = el('div', { class: 'fields' });
  const errP = el('p', { class: 'err', hidden: true });
  const paint = () => {
    box.replaceChildren();
    for (const f of F.fields()) {
      if (f.show && !f.show(vals)) continue;
      if (f.t === 'h') { box.append(el('h3', { class: 'fh' }, f.l)); continue; }
      if (f.t === 'tags') { const cur = Array.isArray(vals[f.k]) ? vals[f.k] : []; vals[f.k] = cur; const wrap = el('div', { class: 'ctrls', role: 'group', 'aria-label': f.l }, (typeof f.o === 'function' ? f.o(vals) : f.o).map((g) => { const id = 'tg_' + g.replace(/\W/g, ''); const cb = el('input', { type: 'checkbox', id, checked: cur.includes(g) }); cb.addEventListener('change', () => { vals[f.k] = cb.checked ? [...vals[f.k], g] : vals[f.k].filter((x) => x !== g); }); return el('label', { for: id, style: 'display:inline-flex;gap:4px;align-items:center;font-size:12.5px' }, cb, g); })); box.append(el('div', { class: 'full', style: 'display:grid;gap:4px;font-size:12.5px;color:var(--muted)' }, f.l, wrap)); continue; }
      let inp;
      if (f.t === 'select') {
        const opts = typeof f.o === 'function' ? f.o(vals) : f.o;
        inp = el('select', { id: 'f_' + f.k }, opts.map(([v, l]) => el('option', { value: v }, l)));
        if (!opts.length && f.empty) inp.append(el('option', { value: '' }, f.empty));
        if (vals[f.k] == null || !opts.some(([v]) => v === vals[f.k])) vals[f.k] = opts.length ? opts[0][0] : '';
        inp.value = vals[f.k];
        inp.addEventListener('change', () => { vals[f.k] = inp.value; if (f.k === 'type' || f.k === 'category' || f.k === 'direction') paint(); });
      } else if (f.t === 'textarea') {
        inp = el('textarea', { id: 'f_' + f.k, rows: 3, placeholder: f.ph || '' }); inp.value = vals[f.k] || '';
        inp.addEventListener('input', () => (vals[f.k] = inp.value));
      } else {
        inp = el('input', { id: 'f_' + f.k, type: f.t, placeholder: f.ph || '', step: f.t === 'number' ? 'any' : null, inputmode: f.t === 'number' ? 'decimal' : null }); inp.value = vals[f.k] ?? '';
        inp.addEventListener('input', () => (vals[f.k] = f.t === 'number' ? (inp.value === '' ? '' : Number(inp.value)) : inp.value));
      }
      box.append(el('label', { class: f.full ? 'full' : null, for: 'f_' + f.k }, f.l + (f.req ? ' *' : ''), inp));
    }
  };
  paint();
  let confirmDel = false;
  const delBtn = rec ? el('button', { type: 'button', class: 'btn danger left' }, 'Delete') : null;
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (!confirmDel) { confirmDel = true; delBtn.textContent = 'Nishchit? Abar chapun'; return; }
    try { await db.collection(col).doc(rec.id).delete(); dlg.close(); toast('Muche fela hoyeche'); } catch (e) { errP.hidden = false; errP.textContent = 'Muchte pareni: ' + (e.message || e.code); }
  });
  const save = el('button', { type: 'submit', class: 'btn primary' }, rec ? 'Save' : 'Jog korun');
  const cancel = el('button', { type: 'button', class: 'btn' }, 'Batil');
  cancel.addEventListener('click', () => dlg.close());
  form.append(el('h2', {}, (rec ? 'Edit: ' : 'Notun ') + F.title), box, errP, el('div', { class: 'act' }, delBtn, cancel, save));
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    for (const f of F.fields()) { if (f.show && !f.show(vals)) { delete vals[f.k]; continue; } if (f.req && (vals[f.k] === '' || vals[f.k] == null)) { errP.hidden = false; errP.textContent = f.l + ' lagbe'; return; } }
    const body = {}; for (const f of F.fields()) if (vals[f.k] !== undefined) body[f.k] = f.t === 'number' && vals[f.k] !== '' ? Number(vals[f.k]) : vals[f.k];
    if (col === 'tasks') { body.status = body.status || (rec && rec.done ? 'complete' : 'todo'); body.done = body.status === 'complete'; body.done_at = body.done ? ((rec && rec.done_at) || new Date().toISOString()) : ''; }
    if (col === 'tasks' && !rec && preset.goal_id) body.goal_id = preset.goal_id;
    if (col === 'tasks' && !rec && preset.plan) Object.assign(body, { plan: preset.plan, week: preset.week, week_start: preset.week_start, rep: false, milestone: false });
    if (col === 'outreach_daily') body.business = AG_ID;
    if (col === 'ctasks') { body.business = AG_ID; if (body.status === 'done' && !(rec && rec.done_at)) body.done_at = new Date().toISOString(); if (body.status !== 'done') body.done_at = ''; }
    if (['posts', 'leads', 'clients', 'feedback', 'proposals', 'meetings', 'lead_lists', 'packages', 'templates', 'sops', 'proofs'].includes(col)) body.business = (rec && rec.business) || preset.business || AG_ID;
    body.updated_at = new Date().toISOString();
    if (!rec) body.created_at = body.updated_at;
    save.disabled = true;
    try {
      if (col === 'budgets') await db.collection('budgets').doc(month + '_' + bizF).set({ ...body, month, business: bizF });
      else if (col === 'client_metrics' && !rec) await db.collection('client_metrics').doc(body.client + '_' + body.month).set(body);
      else if (col === 'outreach_daily' && !rec) await db.collection('outreach_daily').doc(AG_ID + '_' + body.date).set(body);
      else if (col === 'sales_daily' && !rec) await db.collection('sales_daily').doc(body.business + '_' + body.date).set({ ...body, source: 'manual' });
      else if (rec) await db.collection(col).doc(rec.id).set({ ...stripId(rec), ...body });
      else await db.collection(col).add(body);
      if (col === 'client_payments' && body.next_due) { const c = S.clients.find((x) => x.id === body.client); if (c) await db.collection('clients').doc(c.id).set({ ...stripId(c), next_payment: body.next_due, updated_at: body.updated_at }); }
      if (col === 'loan_payments' && !rec) { const l = S.loans.find((x) => x.id === body.loan); if (l) { const o = Math.max(0, (Number(l.outstanding) || 0) - (Number(body.amount) || 0)); await db.collection('loans').doc(l.id).set({ ...stripId(l), outstanding: o, status: o === 0 ? 'closed' : l.status, updated_at: body.updated_at }); } }
      dlg.close(); toast(rec ? 'Save hoyeche' : 'Jog hoyeche');
    } catch (e) { save.disabled = false; errP.hidden = false; errP.textContent = e.code === 'quota_exceeded' ? 'Database bhore geche, purono data muchun' : e.code === 'invalid_argument' ? 'Save hoyni: apnar likhar permission nai ba data thik nai' : 'Save hoyni, abar chesta korun'; }
  };
  dlg.showModal();
  const first = form.querySelector('input,select,textarea'); if (first) first.focus();
}
const stripId = (r) => { const o = { ...r }; delete o.id; return o; };

function showTip(box, ev, a, b) { const t = tipOf(box); const r = box.getBoundingClientRect(); const px = ev.clientX - r.left, py = ev.clientY - r.top; t.hidden = false; t.replaceChildren(el('div', { class: 'd' }, a), el('div', {}, b)); const w = t.offsetWidth; t.style.left = Math.min(Math.max(0, px - w / 2), box.clientWidth - w) + 'px'; t.style.top = Math.max(0, py - 52) + 'px'; }

function cashChart(box, m) {
  const [y, mm] = m.split('-').map(Number); const nDays = new Date(y, mm, 0).getDate();
  const list = txs().filter((t) => inMonth(t, m));
  const inc = [], exp = []; let ci = 0, ce = 0;
  for (let d = 1; d <= nDays; d++) { const ds = m + '-' + String(d).padStart(2, '0'); ci += sumBy(list.filter((t) => t.date === ds && t.type === 'income'), (t) => t.amount); ce += sumBy(list.filter((t) => t.date === ds && t.type === 'expense'), (t) => t.amount); inc.push({ d, v: ci }); exp.push({ d, v: ce }); }
  const isCur = m === todayStr().slice(0, 7); const cutDay = isCur ? new Date().getDate() : nDays;
  const I = inc.slice(0, cutDay), E = exp.slice(0, cutDay); const budget = budgetFor(m);
  const W = Math.max(280, box.clientWidth), H = 250, M = { t: 14, r: 12, b: 26, l: 50 };
  const x = d3.scaleLinear([1, nDays], [M.l, W - M.r]);
  const yM = Math.max(budget, d3.max(I, (d) => d.v) || 0, d3.max(E, (d) => d.v) || 0, 1000);
  const yy = d3.scaleLinear([0, yM], [H - M.b, M.t]).nice();
  box.replaceChildren();
  const svg = d3.select(box).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', '100%').attr('role', 'img').attr('aria-label', 'Cumulative income and expenses this month');
  svg.append('g').selectAll('line').data(yy.ticks(5)).join('line').attr('x1', M.l).attr('x2', W - M.r).attr('y1', (d) => yy(d)).attr('y2', (d) => yy(d)).attr('stroke', 'rgba(255,255,255,.07)');
  svg.append('g').selectAll('text').data(yy.ticks(5)).join('text').attr('x', M.l - 8).attr('y', (d) => yy(d) + 4).attr('text-anchor', 'end').attr('fill', 'currentColor').attr('opacity', .6).style('font-size', '11px').text((d) => (d >= 1000 ? d / 1000 + 'k' : d));
  svg.append('g').selectAll('text').data([1, 10, 20, nDays]).join('text').attr('x', (d) => x(d)).attr('y', H - 6).attr('text-anchor', 'middle').attr('fill', 'currentColor').attr('opacity', .6).style('font-size', '11px').text((d) => d + ' ' + new Date(y, mm - 1, 1).toLocaleDateString('en-GB', { month: 'short' }));
  const defs = svg.append('defs');
  [['gi', '#3FD3A8'], ['ge', '#4EA8FF']].forEach(([id, c]) => { const g = defs.append('linearGradient').attr('id', id).attr('x1', 0).attr('x2', 0).attr('y1', 0).attr('y2', 1); g.append('stop').attr('offset', 0).attr('stop-color', c).attr('stop-opacity', .32); g.append('stop').attr('offset', 1).attr('stop-color', c).attr('stop-opacity', 0); });
  const area = d3.area().x((d) => x(d.d)).y0(yy(0)).y1((d) => yy(d.v)).curve(d3.curveMonotoneX);
  const line = d3.line().x((d) => x(d.d)).y((d) => yy(d.v)).curve(d3.curveMonotoneX);
  svg.append('path').datum(E).attr('fill', 'url(#ge)').attr('d', area);
  svg.append('path').datum(I).attr('fill', 'url(#gi)').attr('d', area);

function adVerdicts(rows) {
  const ads = rows.map((r) => { const spend = Number(r.cost) || 0, res = (Number(r.new_messaging_conversations_7d) || 0) + (Number(r.offsite_conversions_fb_pixel_purchase) || 0) * 3; return { ...r, spend, results: Number(r.new_messaging_conversations_7d) || 0, purchases: Number(r.offsite_conversions_fb_pixel_purchase) || 0, wres: res, ctr: (Number(r.link_CTR) || 0) * 100, freq: Number(r.Frequency) || 0, cpr: res ? spend / res : null }; });
  const tot = ads.reduce((a, x) => ({ s: a.s + x.spend, r: a.r + x.wres }), { s: 0, r: 0 });
  const avg = tot.r ? tot.s / tot.r : null;
  const ctrAvg = ads.length ? ads.reduce((s, x) => s + x.ctr * x.spend, 0) / (tot.s || 1) : 0;
  ads.forEach((x) => {
    let v = 'hold', why = 'Data kom, aro 2-3 din chalan', fix = 'Kichu bodlaben na';
    if (x.spend < 2) { v = 'learn'; why = 'Ekhono $2 er kom khoroch'; fix = 'Opekkha korun'; }
    else if (!x.wres && x.spend >= 4) { v = 'stop'; why = '$' + x.spend.toFixed(2) + ' khoroch, kono result nai'; fix = 'Bondho korun; budget bhalo ad e din'; }
    else if (avg && x.cpr >= avg * 1.8) { v = 'stop'; why = 'Cost per result $' + x.cpr.toFixed(2) + ', gor $' + avg.toFixed(2) + ' er ' + Math.round(x.cpr / avg) + 'x'; fix = 'Bondho korun ba notun creative din'; }
    else if (x.freq > 2.5) { v = 'fix'; why = 'Frequency ' + x.freq.toFixed(1) + ': ek manush bar bar dekhche'; fix = 'Notun creative din ba audience boro korun'; }
    else if (x.ctr < 0.6 && x.spend >= 3) { v = 'fix'; why = 'CTR ' + x.ctr.toFixed(2) + '%, kom manush click korche'; fix = 'Hook (prothom 3 second / headline) bodlan'; }
    else if (avg && x.cpr <= avg * 0.8 && x.spend >= 3) { v = 'scale'; why = 'Cost per result $' + x.cpr.toFixed(2) + ', gor er cheye ' + Math.round((1 - x.cpr / avg) * 100) + '% kom'; fix = 'Budget 20-30% baran, 2 din por abar dekhun'; }
    else if (x.cpr) { why = 'Cost per result $' + x.cpr.toFixed(2) + ', gor er kache'; fix = 'Chalate thakun'; }

  });

/* ---------- routing ---------- */
const tabsEl = document.getElementById('tabs');
const tabsFor = (r) => (r === 'biz:lrf' ? ATABS : r.startsWith('biz:') ? BTABS : TABS[r]);
function go(r, t) {
  route = r; const TT = tabsFor(r); tab = TT ? (TT.some((x) => x[0] === t) ? t : TT[0][0]) : 'overview';
  remember(); render();
}
document.querySelectorAll('.nav').forEach((n) => n.addEventListener('click', () => { go(n.dataset.go, n.dataset.go.startsWith('biz:') ? 'briefing' : 'overview'); }));

function render() {
  const isBiz = route.startsWith('biz:'); const bid = isBiz ? route.slice(4) : null;
  document.querySelectorAll('.nav').forEach((n) => n.setAttribute('aria-current', n.dataset.go === route ? 'page' : 'false'));
  const [ttl, sub] = isBiz ? [bizName(bid), 'Business er nijer hishab, kaj, issue ar idea'] : TITLES[route] || TITLES.overview;
  document.getElementById('title').textContent = ttl; document.getElementById('subtitle').textContent = sub;
  const T = tabsFor(route);
  tabsEl.hidden = !T;
  tabsEl.replaceChildren(...(T || []).map(([id, l]) => { const b = el('button', { class: 'tab', role: 'tab', id: 'tab-' + id, 'aria-selected': String(id === tab) }, l); b.addEventListener('click', () => go(route, id)); return b; }));
  document.getElementById('crumb').replaceChildren('Business OS › ', isBiz ? 'Business › ' : '', el('b', {}, ttl), T && tab !== 'overview' ? ' › ' + T.find((x) => x[0] === tab)[1] : '');
  document.getElementById('bizf').disabled = isBiz;
  const v = document.getElementById('view');
  let parts;
  if (!ready) parts = [el('div', { class: 'empty' }, el('b', {}, 'Data load hocche…'), el('span', {}, 'Ektu opekkha korun.'))];
  else if (!db) parts = [el('div', { class: 'banner' }, 'Data save korar connection pawa jacche na. Claude e sign in kore page ta abar khulun.')];
  else parts = isBiz ? bizView(bid) : (VIEWS[route] || VIEWS.overview)();
  if (!canWrite && db) parts.unshift(el('div', { class: 'banner' }, 'Apni ei page dekhte parben, kintu data jog ba bodlate parben na.'));
  v.replaceChildren(el('div', { style: 'display:grid;gap:14px' }, parts));
  // badges
  const att = ready ? attentionItems().length : 0; const iss = S.issues.filter((i) => i.status !== 'solved').length;
  const lastRev = S.reviews.map((r) => r.date).sort().pop(); const revDue = ready && (!lastRev || daysTo(lastRev) < -7);
  setBadge('b-learn', ready ? libPaused('learning').length : 0); setBadge('b-books', ready ? libPaused('books').length : 0);
  setBadge('b-att', att); setBadge('b-iss', iss); setBadge('b-review', revDue ? 1 : 0);
}
const setBadge = (id, n) => { const b = document.getElementById(id); b.hidden = !n; b.textContent = n; };

/* ---------- controls ---------- */
const monthSel = document.getElementById('month');
(() => { const d = new Date(); for (let i = -2; i < 13; i++) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); const m = x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); monthSel.append(el('option', { value: m }, monthLabel(m))); } monthSel.value = month; })();
monthSel.addEventListener('change', () => { month = monthSel.value; render(); });
const bizSel = document.getElementById('bizf');
bizSel.append(el('option', { value: 'all' }, 'Shob business'), ...BIZ.map((b) => el('option', { value: b.id }, b.name)));
bizSel.value = bizF; bizSel.addEventListener('change', () => { bizF = bizSel.value; remember(); render(); });
const qIn = document.getElementById('q');
let qT; qIn.addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { query = qIn.value.trim(); if (query && !['transactions', 'search', 'ideas', 'issues'].includes(route === 'money' ? tab : route)) { route = 'search'; tab = 'overview'; } render(); qIn.focus(); }, 250); });
document.addEventListener('keydown', (e) => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !dlg.open) { e.preventDefault(); qIn.focus(); } });

/* ---------- data ---------- */
const syncEl = document.getElementById('sync');
render();
(async () => {
  claude.use('mcp').then((m) => { mcp = m; render(); });
  claude.use('sample').then((x) => { sampleFn = x; });
  db = await claude.use('db');
  const user = await claude.use('user');
  if (user) { try { const c = await user.can('data.write'); if (c === false) canWrite = false; } catch (e) {} }
  if (!db) { ready = true; syncEl.textContent = 'Offline'; render(); return; }
  let pending = COLS.length;
  COLS.forEach((c) => db.collection(c).onSnapshot((snap) => {
    S[c] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (pending > 0 && !snap.metadata.fromCache) pending--;
    ready = true; syncEl.textContent = 'Synced'; render();
  }, () => { syncEl.textContent = 'Sync bondho'; }));
  setTimeout(() => { if (!ready) { ready = true; render(); } }, 6000);
})();
